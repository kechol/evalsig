[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kechol/evalsig"
authors = ["The evalsig contributors"]

[workspace.dependencies]
evalsig-core = { path = "crates/evalsig-core", version = "0.1.0" }
evalsig-store = { path = "crates/evalsig-store", version = "0.1.0" }
evalsig-adapters = { path = "crates/evalsig-adapters", version = "0.1.0" }
evalsig-dashboard = { path = "crates/evalsig-dashboard", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"

unicode-normalization = "0.1.26"
blake3 = "1.8"
sha2 = "0.11"
ruzstd = "0.9.1"

assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
