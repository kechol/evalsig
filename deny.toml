# Licence, advisory, ban and source policy enforced in CI by cargo-deny.
# Adding a licence to `allow` is a dependency decision (docs/decisions.md).

[graph]
all-features = true

[advisories]
yanked = "deny"
# D-013: unmaintained, compile time only, through age's i18n-embed-fl proc-macro.
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml via i18n-embed-fl (proc-macro), D-013" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 via i18n-embed-fl (proc-macro), D-013" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# D-026: build-time only, on wasm32, through parquet -> ahash -> const-random.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
