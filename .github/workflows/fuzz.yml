name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [zip, zstd, json]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: fuzz -> target
      - run: cargo +nightly install cargo-fuzz@0.13.2 --locked
      - name: Fuzz ${{ matrix.target }} for a fixed budget
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} \
            -- -max_total_time=300 -rss_limit_mb=2048
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
