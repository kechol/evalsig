name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install the age CLI, which must open sealed files
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install age
          else
            sudo apt-get update && sudo apt-get install -y age
          fi
      # Windows runs without the age CLI and without Unix sockets (gate serve
      # answers token HTTP only there).
      - run: cargo test --workspace --locked
        env:
          EVALSIG_REQUIRE_AGE: ${{ runner.os != 'Windows' && '1' || '0' }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --locked -p evalsig-cli
      - name: init, import, report and compare over the examples
        run: scripts/smoke_test.sh target/debug/evalsig

  gate-two-users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --locked -p evalsig-cli
      - name: gate serve and gate submit across two OS users
        run: sudo scripts/gate_two_users.sh target/debug/evalsig

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the MSRV from the workspace manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo +"${{ steps.msrv.outputs.version }}" build --workspace --locked

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: scripts/uv.lock
      - run: uv run --locked --project scripts scripts/check_fixtures.py

  cross-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: scripts/uv.lock
      - run: cargo build --locked -p evalsig-cli
      - name: verify Rust-produced ledgers, objects and reports with the Python verifier
        run: scripts/cross_verify.sh target/debug/evalsig

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: cargo-audit
      - run: cargo audit

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
