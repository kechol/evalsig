name: Feature request
description: A question evalsig should answer, a format it should read, or an output it should produce
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to decide or measure, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command, option or output you have in mind. Cite the method or paper for new statistics.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
